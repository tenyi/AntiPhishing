[imap]
host = "imap.example.com"
port = 993
# 可選值：imaps 或 starttls
protocol = "imaps"
username = "you@example.com"
password = "請改用應用程式密碼"
source_mailbox = "INBOX"
phishing_mailbox = "Phishing"

[detection]
# 建議先執行 --dry-run，依結果調整門檻與清單。
threshold = 5
suspicious_sender_domains = ["evil.example"]
# 信任寄件網域白名單：若未發生 SPF/DMARC 偽造失敗則直接安全豁免（略過不送檢、不搬移）；若安全驗證失敗則取消豁免並告警送檢。
trusted_sender_domains = ["company.example", "hinet.net"]
suspicious_keywords = ["verify", "urgent", "password", "login", "帳戶", "驗證", "緊急", "密碼"]
# Word 附件以外部圖片追蹤開啟行為時加分；預設 5，會單獨達到預設門檻。
external_word_image_score = 5

# LLM 智慧判定設定。
# 支援 OpenAI 相容 HTTP API，以及命令列呼叫 Claude Code CLI / OpenAI Codex CLI / Antigravity CLI / 自訂命令。
# backend 可選值：
#   "api"     : 地端/雲端 OpenAI 相容 API（例如 Ollama / LM Studio / llama.cpp / vLLM）
#   "jev"     : TypeSafe Jev API (System One，採混合評分制，機率換算為分數)
#   "claude"  : Claude Code CLI (claude)
#   "codex"   : OpenAI Codex CLI (codex)
#   "agy"     : Antigravity CLI (agy)
#   "command" : 自訂命令列（透過 stdin 傳入 Prompt）
# 若未指定 backend：當 base_url 非空時自動以 api 模式運作；若皆留空即停用 LLM 判定。
# 啟用後：
#   - 一般 LLM 模式（api/claude/codex/agy/command）：LLM 判定為真者才搬移，評分僅供 log 參考。
#   - Jev 模式（jev）：採混合評分制，Jev 評定釣魚機率未滿 60% 不計分，60%~100% 依比例換算為 0~jev_max_score 分與規則分數加總，達標（>= threshold）才搬移。
# 預設搬移前會互動確認（--yes 可跳過）。
[llm]
# backend = "api"
base_url = "http://127.0.0.1:11434/v1"
model = "llama3.1"
# 可選：API 金鑰（若使用地端免認證模型如 Ollama 可留空；若使用需認證模型或 Jev 必須填入）
api_key = ""
# 可選：當 backend = "jev" 時的分數換算上限（未滿 60% 不計分，60%~100% 線性換算），預設 5
# jev_max_score = 5
# 可選：當 backend = "command" 時執行的自訂命令字串（例如 "ollama run llama3.1"）
# command = ""
# 可選：單一請求或命令執行逾時（秒），預設 120
timeout_secs = 120
# 可選：送給 LLM 的郵件內文最大字元數，預設 6000
max_chars = 6000
