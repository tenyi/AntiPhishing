[package]
name = "anti-phishing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
imap = "3.0.0-alpha.15"
mailparse = "0.16"
regex = "1.13"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
zip = "8.6"
