[package]
name = "antiphishing-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
imap = "3.0.0-alpha.15"
mailparse = "0.16.1"
native-tls = "0.2.18"
quick-xml = "0.41.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = "9.0.0-pre.2"

[dev-dependencies]
toml = "1.1.4"
