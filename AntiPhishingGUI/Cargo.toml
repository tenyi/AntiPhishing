[package]
name = "anti-phishing-gui"
version = "2.8.3"
edition = "2024"

[dependencies]
antiphishing-core = { path = "../AntiPhishingCore" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
mailparse = "0.16.1"
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tray-icon = "0.24.2"
single-instance = "0.3"
notify-rust = "4"

[build-dependencies]
winres = "0.1"

