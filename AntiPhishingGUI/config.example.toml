[imap]
host = "imap.example.com"
port = 993
protocol = "imaps"
username = "you@example.com"
password = "請使用應用程式密碼"
source_mailbox = "INBOX"
phishing_mailbox = "Phishing" # 可選擇自己偏好的 mailbox

[detection]
#超過此分數則視為 Spam / Phishing mail
threshold = 10
suspicious_sender_domains = ["evil.example"]
# 信任寄件網域白名單：若未發生 SPF/DMARC 偽造失敗則直接安全豁免（略過不送檢、不搬移）；若安全驗證失敗則取消豁免並告警送檢。
trusted_sender_domains = ["company.example", "hinet.net"]
# 信任來源 IP：只比對最上層 Received 標頭的來源 IP（完全相符），命中且驗證無失敗即豁免。只填內部郵件伺服器；切勿填郵件閘道（如 MailCloud）IP，否則所有外部信都會被放行。
trusted_relay_ips = []
suspicious_keywords = ["verify", "urgent", "password", "login", "帳戶", "驗證", "緊急", "密碼", "掃描", "QR", "DHL", "關稅"]
external_word_image_score = 6

[gui]
check_interval_minutes = 10
minimize_to_tray = true
hide_taskbar_when_minimized = true
start_minimized_to_tray = false
# 可選：每輪掃描後、搬移前顯示確認對話框（全部搬移／全部跳過），預設 true
confirm_before_move = true
# 可選：每日日誌 logs\YYYY-MM-DD.log 的保留天數，超過即於啟動時刪除；設為 0 表示永不清理，預設 30
log_retention_days = 30
# 可選：Noto Sans TC、微軟正黑體、Microsoft JhengHei，或本機 .ttf/.ttc/.otf 完整路徑。
font_family = "Noto Sans TC"
# 可選：外觀主題 system（跟隨系統）、light、dark，預設 system
theme = "system"

# LLM 智慧判定設定。
# 支援 OpenAI 相容 HTTP API，以及命令列呼叫 Claude Code CLI / OpenAI Codex CLI / Antigravity CLI / 自訂命令。
# backend 可選值：
#   "api"     : 地端/雲端 OpenAI 相容 API（例如 Ollama / LM Studio / llama.cpp / vLLM）
#   "jev"     : TypeSafe Jev API (System One，採混合評分制，機率換算為分數)
#   "claude"  : Claude Code CLI (claude)
#   "codex"   : OpenAI Codex CLI (codex)
#   "agy"     : Antigravity CLI (agy)
#   "command" : 自訂命令列（透過 stdin 傳入 Prompt）
# 若未指定 backend：當 base_url 非空時自動以 api 模式運作；若皆留空即停用 LLM 判定（不搬移任何郵件）。
# 啟用後：
#   - 一般 LLM 模式（api/claude/codex/agy/command）：LLM 判定為真者才隔離，評分僅供 log 參考。
#   - Jev 模式（jev）：採混合評分制，Jev 評定釣魚機率未滿 60% 不計分，60%~100% 依比例換算為 0~jev_max_score 分與規則分數加總，達標（>= threshold）才隔離。
[llm]
# backend = "api"
base_url = "http://127.0.0.1:11434/v1"
model = "llama3.1"
# 可選：API 金鑰（若使用地端免認證模型如 Ollama 可留空；若使用需認證模型或雲端 Jev 必須填入；model 為 nimble 的地端 Nimble 免填）
api_key = ""
# 可選：當 backend = "jev" 時的分數換算上限（未滿 60% 不計分，60%~100% 線性換算），預設 10
# jev_max_score = 10
# 可選：Jev 起算機率（低於此值不計分，起算值~1.0 線性換算為 0~jev_max_score 分），預設 0.6；設 0 即 0~100% 全程給分
# jev_min_prob = 0
# 地端 Ollama Nimble（相容 Jev，ollama pull nimble）：backend = "jev"、model = "nimble"、base_url = "http://127.0.0.1:11434"（必填，.../v1 亦可），免 api_key，門檻與 Jev 相同
# 可選：當 backend = "command" 時執行的自訂命令字串（例如 "ollama run llama3.1"）
# command = ""
# 可選：單一請求或命令執行逾時（秒），預設 120
timeout_secs = 120
# 可選：送給 LLM 的郵件內文最大字元數，預設 6000
max_chars = 6000
