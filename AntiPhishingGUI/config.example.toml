[imap]
host = "imap.example.com"
port = 993
protocol = "imaps"
username = "you@example.com"
password = "請使用應用程式密碼"
source_mailbox = "INBOX"
phishing_mailbox = "Phishing" # 可選擇自己偏好的 mailbox

[detection]
threshold = 5
suspicious_sender_domains = ["evil.example"]
trusted_sender_domains = []
suspicious_keywords = ["verify", "urgent", "password", "login", "帳戶", "驗證", "緊急", "密碼", "掃描", "QR", "DHL", "關稅"]
external_word_image_score = 5

[gui]
check_interval_minutes = 10
minimize_to_tray = true
hide_taskbar_when_minimized = true
start_minimized_to_tray = false
# 可選：每輪掃描後、搬移前顯示確認對話框（全部搬移／全部跳過），預設 true
confirm_before_move = true
# 可選：每日日誌 logs\YYYY-MM-DD.log 的保留天數，超過即於啟動時刪除；設為 0 表示永不清理，預設 30
log_retention_days = 30
# 可選：Noto Sans TC、微軟正黑體、Microsoft JhengHei，或本機 .ttf/.ttc/.otf 完整路徑。
font_family = "Noto Sans TC"

# 地端 LLM 判定（OpenAI 相容 API，例如 Ollama / LM Studio / llama.cpp）。
# base_url 或 model 留空即停用 LLM 判定（不搬移任何郵件）。
[llm]
base_url = "http://127.0.0.1:11434/v1"
model = "llama3.1"
# 可選：API 金鑰（若使用地端免認證模型如 Ollama 可留空；若使用需認證模型請填入）
api_key = ""
# 可選：單一請求逾時（秒），預設 120
timeout_secs = 120
# 可選：送給 LLM 的郵件內文最大字元數，預設 6000
max_chars = 6000
